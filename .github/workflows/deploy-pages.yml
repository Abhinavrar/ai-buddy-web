name: Deploy web build to GitHub Pages

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export arm A (social-action)
        run: npx expo export --platform web --output-dir dist-a
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://ai-buddy-api-cinz.onrender.com' }}
          EXPO_PUBLIC_APP_VARIANT: a
          EXPO_BASE_URL: /ai-buddy-web/a
      - name: Export arm B (support-only)
        run: npx expo export --platform web --output-dir dist-b
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://ai-buddy-api-cinz.onrender.com' }}
          EXPO_PUBLIC_APP_VARIANT: b
          EXPO_BASE_URL: /ai-buddy-web/b
      - name: Assemble site (a/ + b/ + neutral landing page)
        run: |
          mkdir dist
          mv dist-a dist/a
          mv dist-b dist/b
          cp .github/pages/index.html dist/index.html
          cp .github/pages/404.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
